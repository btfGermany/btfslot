<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BTF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000',
                        'primary-dark': '#000',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="w-28 h-28 rounded-lg flex items-center justify-center text-white text-4xl font-bold transition-all hover:shadow-xl hover:shadow-blue-300 hover:-translate-y-1">
                    <img src="https://btfmedia.de/imag/btfmedia.de.png">
                </div>
            </div>
            
            <!-- Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <!-- Header -->
           
                
                <!-- Body -->
                <div class="p-6">
                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                            <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg mb-6 text-sm border border-red-100">
                                {{ message }}
                            </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <!-- Form -->
                    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-200 focus:border-primary transition-all duration-200" 
                                required
                            >
                        </div>
                        
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-200 focus:border-primary transition-all duration-200" 
                                required
                            >
                        </div>
                        
                        <button 
                            type="submit" 
                            class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-2.5 px-4 rounded-lg transition-all duration-200 shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-blue-300 mt-2"
                        >
                            Login
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="mt-6 text-center text-gray-500 text-sm">
                © 2025 btfmedia.de Diese Webseite ist Privat
            </div>
        </div>
    </div>
</body>
</html>
