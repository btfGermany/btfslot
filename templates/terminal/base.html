<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Küchen Terminal{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap für responsive Design und große Bedienelemente -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Zusätzliche Anpassungen für Touch-Bedienung in der Küche -->
  <style>
    :root {
      --font-size-base: 1.1rem; /* Größere Grundschrift */
    }
    
    html, body {
      height: 100%;
      font-size: var(--font-size-base);
      touch-action: manipulation; /* Verhindert Verzögerung bei Touch-Ereignissen */
    }
    
    body {
      background-color: #f0f2f5;
      padding-bottom: 1rem;
    }
    
    /* Größere Schaltflächen für einfachere Bedienung */
    .btn {
      min-height: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
    }
    
    /* Bessere Lesbarkeit für Karten */
    .card {
      border-width: 2px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    /* Größere Text-Klassen */
    .text-xl {
      font-size: 1.25rem !important;
    }
    
    .text-2xl {
      font-size: 1.5rem !important;
    }
    
    .text-3xl {
      font-size: 1.75rem !important;
    }
    
    /* Status-Farbcodierung */
    .border-success {
      border-color: #28a745 !important;
      border-width: 3px !important;
    }
    
    .border-warning {
      border-color: #ffc107 !important;
      border-width: 3px !important;
    }
    
    /* Auto-Refresh */
    .auto-refresh-indicator {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
    }
    
    /* Touch-freundliche Listen */
    .list-group-item {
      padding: 1rem;
    }
    
    /* Schweiß-/Fett-resistente Bedienoberfläche (größere Abstände) */
    .btn, .card-header, .card-body, .card-footer {
      padding: 1rem;
    }
  </style>
</head>
<body>
  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <!-- Auto-Refresh Indikator -->
  <div class="auto-refresh-indicator">
    Aktualisierung in <span id="countdown">60</span>s
  </div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Auto-Refresh der Seite alle 30 Sekunden -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let countdown = 60;
      const countdownElement = document.getElementById('countdown');
      
      // Timer für Countdown aktualisieren
      setInterval(function() {
        countdown--;
        countdownElement.textContent = countdown;
        
        if (countdown <= 0) {
          // Seite neu laden
          location.reload();
        }
      }, 1000);
      
      // Touch-Events optimieren
      document.querySelectorAll('.btn').forEach(button => {
        button.addEventListener('touchstart', function() {
          this.classList.add('active');
        });
        button.addEventListener('touchend', function() {
          this.classList.remove('active');
        });
      });
    });
  </script>
</body>
</html>
