{% extends 'admin/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="flex flex-wrap items-center justify-between mb-8 border-b border-indigo-100 pb-5">
        <div class="flex items-center space-x-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10c0 4.418-3.582 8-8 8s-8-3.582-8-8 3.582-8 8-8 8 3.582 8 8zm-9-3a1 1 0 112 0v2a1 1 0 11-2 0V7zm1 6a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" clip-rule="evenodd" />
            </svg>
            <h1 class="text-3xl font-light text-gray-800">Benutzer bearbeiten</h1>
        </div>
        <a href="{{ url_for('manage_users') }}" class="flex items-center bg-gray-50 hover:bg-gray-100 text-gray-700 px-4 py-2 rounded transition duration-150 border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Zurück
        </a>
    </div>

    <div class="bg-white border border-gray-200 rounded overflow-hidden">
        <form method="POST" class="p-6 space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Benutzername</label>
                <input placeholder="Benutzername" type="text" id="username" name="username" value="{{ user.username }}" required class="block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">Neues Passwort (leer lassen, um beizubehalten)</label>
                <input placeholder="Passwort" type="password" id="new_password" name="new_password" class="block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Rolle</label>
                <select id="role" name="role" class="block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="user" {% if user.role == 'user' %}selected{% endif %}>Benutzer</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <a href="{{ url_for('manage_users') }}" class="flex items-center bg-gray-50 hover:bg-gray-100 px-4 py-2 rounded-md text-gray-700 transition border border-gray-200">
                    Abbrechen
                </a>
                <button type="submit" class="flex items-center bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-md text-white transition">
                    Speichern
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
