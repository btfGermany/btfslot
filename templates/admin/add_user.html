{% extends 'admin/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="flex flex-wrap items-center justify-between mb-8 border-b border-indigo-100 pb-5">
        <div class="flex items-center space-x-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm-1-4a1 1 0 112 0v1a1 1 0 11-2 0v-1zm.293-6.707a1 1 0 011.414 0L12 9.586V7a1 1 0 112 0v6a1 1 0 01-1 1h-2.586l-1.293 1.293a1 1 0 01-1.414-1.414L10.586 13H9a1 1 0 01-1-1V9.414l1.293-1.293z" clip-rule="evenodd" />
            </svg>
            <h1 class="text-3xl font-light text-gray-800">Neuen Benutzer erstellen</h1>
        </div>
        <a href="{{ url_for('manage_users') }}" class="flex items-center bg-gray-50 hover:bg-gray-100 text-gray-700 px-4 py-2 rounded transition duration-150 border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Zurück
        </a>
    </div>

    <div class="bg-white border border-gray-200 rounded overflow-hidden">
        <form method="POST" class="p-6 space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Benutzername</label>
                <input placeholder="Benutzername" type="text" id="username" name="username" required class="block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Passwort</label>
                <input placeholder="Passwort" type="password" id="password" name="password" required class="block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Rolle</label>
                <select id="role" name="role" class="btf-sel block w-full rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="admin">Administrator</option>
                    <option value="manager">Manager</option>
                    <option value="mitarbeiter">Mitarbeiter</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <a href="{{ url_for('manage_users') }}" class="flex items-center bg-gray-50 hover:bg-gray-100 px-4 py-2 rounded-md text-gray-700 transition border border-gray-200">
                    Abbrechen
                </a>
                <button type="submit" class="flex items-center bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-md text-white transition">
                    Benutzer erstellen
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
