{% extends 'admin/base.html' %}

{% block content %}
<h1>Benutzerverwaltung</h1>
<a href="{{ url_for('add_user') }}" class="btn btn-success mb-3">Neuer Benutzer</a>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Benutzername</th>
            <th>Rolle</th>
            <th>Aktionen</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
            <td>
                <a href="#" class="btn btn-sm btn-warning">Bearbeiten</a>
                <form action="#" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger">Löschen</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
