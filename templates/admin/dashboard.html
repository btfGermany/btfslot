<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    {% extends "admin/base.html" %}
    
    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <!-- Header-Bereich mit neuem Design -->
        <div class="flex flex-wrap items-center justify-between mb-8 border-b border-indigo-100 pb-5">
            <div class="flex items-center space-x-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
                </svg>
                <h1 class="text-3xl font-light text-gray-800">Admin Dashboard</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <p class="text-sm text-gray-500">{{ today }}</p>
                <button id="configButton" class="flex items-center bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                    </svg>
                    Dashboard konfigurieren
                </button>
            </div>
        </div>
<!-- HTML Structure -->
<form action="/search" method="get" class="search-container">
    <div class="search-group">
      <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path>
      </svg>
      <input 
        type="search" 
        name="q" 
        id="search-input"
        placeholder="Suche das was du willst..." 
        class="search-input"
        value="{{ request.args.get('q', '') }}"
        autocomplete="off"
      >
    </div>
    <div id="search-suggestions" class="search-suggestions"></div>
  </form>
  
  <!-- CSS Styles -->
  <style>
  .search-container {
    max-width: 500px;
    margin: 0 auto;
    position: relative;
  }
  
  .search-group {
    display: flex;
    align-items: center;
    position: relative;
    width: 100%;
  }
  
  .search-input {
    width: 100%;
    height: 45px;
    line-height: 28px;
    padding: 0 1rem;
    padding-left: 2.5rem;
    border: 2px solid transparent;
    border-radius: 8px;
    outline: none;
    background-color: #f3f3f4;
    color: #0d0c22;
    transition: .3s ease;
  }
  
  .search-input::placeholder {
    color: #9e9ea7;
  }
  
  .search-input:focus, .search-input:hover {
    outline: none;
    border-color: rgba(99, 102, 241, 0.4);
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }
  
  .search-icon {
    position: absolute;
    left: 1rem;
    fill: #9e9ea7;
    width: 1rem;
    height: 1rem;
    pointer-events: none;
  }
  
  .search-suggestions {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background-color: white;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    z-index: 10;
    margin-top: -5px;
    border: 1px solid #e2e8f0;
    border-top: none;
  }
  
  .search-suggestions.active {
    display: block;
  }
  
  .suggestion-item {
    padding: 10px 15px;
    display: flex;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    color: #0d0c22;
  }
  
  .suggestion-item:hover {
    background-color: #f7f7f9;
  }
  
  .suggestion-icon {
    margin-right: 12px;
    color: #9e9ea7;
  }
  
  .suggestion-text {
    flex-grow: 1;
  }
  
  .suggestion-type {
    font-size: 0.8rem;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 10px;
    background-color: #f3f3f4;
    color: #6c757d;
  }
  
  .search-suggestions-footer {
    padding: 8px 15px;
    text-align: right;
    font-size: 0.8rem;
    color: #6c757d;
    border-top: 1px solid #f0f0f0;
  }
  </style>
  
  <!-- JavaScript -->
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const suggestionsContainer = document.getElementById('search-suggestions');
    
    // Send request on every keystroke
    searchInput.addEventListener('input', function() {
      const query = this.value.trim();
      
      if (query.length > 0) {
        fetchSuggestions(query);
      } else {
        suggestionsContainer.innerHTML = '';
        suggestionsContainer.classList.remove('active');
      }
    });
    
    // Keep dropdown open when input is focused
    searchInput.addEventListener('focus', function() {
      if (this.value.trim().length > 0 && suggestionsContainer.children.length > 0) {
        suggestionsContainer.classList.add('active');
      }
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
        suggestionsContainer.classList.remove('active');
      }
    });
    
    // Fetch suggestions from the API
    function fetchSuggestions(query) {
      fetch(`/api/search_suggestions?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
          suggestionsContainer.innerHTML = '';
          
          if (data.length === 0) {
            suggestionsContainer.classList.remove('active');
            return;
          }
          
          // Add each suggestion item
          data.forEach(suggestion => {
            const item = document.createElement('a');
            item.href = suggestion.url;
            item.className = 'suggestion-item';
            
            item.innerHTML = `
              <svg class="suggestion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <div class="suggestion-text">${highlightQuery(suggestion.text, query)}</div>
              <span class="suggestion-type">${suggestion.type}</span>
            `;
            
            suggestionsContainer.appendChild(item);
          });
          
          // Add footer (Google-style)
          const footer = document.createElement('div');
          footer.className = 'search-suggestions-footer';
          footer.textContent = 'Suche drücken für alle Ergebnisse';
          suggestionsContainer.appendChild(footer);
          
          suggestionsContainer.classList.add('active');
        })
        .catch(error => {
          console.error('Error fetching suggestions:', error);
          suggestionsContainer.classList.remove('active');
        });
    }
    
    // Highlight the matching part of the query
    function highlightQuery(text, query) {
      try {
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<strong>$1</strong>');
      } catch (e) {
        return text; // Fall back to normal text if regex fails
      }
    }
  });
  </script><br><br>
        <!-- Widget-Container -->
        <div id="widgetsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Widgets werden hier eingefügt -->
        </div>
    </div>

    <!-- Konfigurations-Modal -->
    <div id="configModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-4xl p-6 border border-indigo-100 shadow-xl">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-indigo-100">
                <h2 class="text-2xl font-light text-gray-800 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M5 4a1 1 0 00-2 0v7.268a2 2 0 000 3.464V16a1 1 0 102 0v-1.268a2 2 0 000-3.464V4zM11 4a1 1 0 10-2 0v1.268a2 2 0 000 3.464V16a1 1 0 102 0V8.732a2 2 0 000-3.464V4zM16 3a1 1 0 011 1v7.268a2 2 0 010 3.464V16a1 1 0 11-2 0v-1.268a2 2 0 010-3.464V4a1 1 0 011-1z"/>
                    </svg>
                    Dashboard konfigurieren
                </h2>
                <button id="closeConfigButton" class="text-gray-500 hover:text-indigo-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <!-- Modal-Inhalt -->
            <div class="space-y-8">
                <div>
                    <h3 class="text-lg font-medium mb-3 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M3 6a3 3 0 013-3h10a1 1 0 01.8 1.6L14.25 8l2.55 3.4A1 1 0 0116 13H6a1 1 0 00-1 1v3a1 1 0 11-2 0V6z"/>
                        </svg>
                        Aktive Widgets
                    </h3>
                    <ul id="activeWidgets" class="border border-indigo-100 rounded-lg p-4 min-h-48 bg-indigo-50 space-y-3">
                        <!-- Aktive Widgets -->
                    </ul>
                </div>

                <div>
                    <h3 class="text-lg font-medium mb-3 text-gray-700 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.974 6 7.5 6A1.5 1.5 0 019 7.5V8a2 2 0 004 0 2 2 0 011.523-1.943A5.977 5.977 0 0116 10c0 .34-.028.675-.083 1H15a2 2 0 00-2 2v2.197A5.973 5.973 0 0110 16v-2a2 2 0 00-2-2 2 2 0 01-2-2 2 2 0 00-1.668-1.973z" clip-rule="evenodd"/>
                        </svg>
                        Verfügbare Widgets
                    </h3>
                    <ul id="availableWidgets" class="border border-indigo-100 rounded-lg p-4 min-h-48 bg-indigo-50 space-y-3">
                        <!-- Verfügbare Widgets -->
                    </ul>
                </div>
            </div>

            <!-- Modal-Actions -->
            <div class="flex justify-end space-x-4 mt-8 pt-5 border-t border-indigo-100">
                <button id="resetDashboardButton" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2 rounded-md transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
                    </svg>
                    Zurücksetzen
                </button>
                <button id="saveDashboardButton" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                    Speichern
                </button>
            </div>
        </div>
    </div>

    <!-- Widget-Templates -->
    <template id="widget-current-slot">
        <div class="widget bg-white p-6 rounded-lg border border-indigo-100 shadow-sm hover:shadow-md transition" data-widget-id="current-slot">
            <h2 class="text-lg font-medium mb-4 text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                </svg>
                Aktueller Zeitslot
            </h2>
            {% if current_slot %}
            <div class="flex justify-between mb-2">
                <span class="text-gray-600">{{ current_slot.start_time }} - {{ current_slot.end_time }}</span>
                <span class="font-bold text-indigo-600">{{ current_slot.usage_percent|round(1) }}% belegt</span>
            </div>
            <div class="w-full bg-indigo-100 rounded-full h-2.5">
                <div class="bg-indigo-600 h-2.5 rounded-full progress-fill" style="width: {{ current_slot.usage_percent }}%"></div>
            </div>
            <div class="mt-4 text-sm text-gray-500">
                <div class="flex justify-between">
                    <span>Kapazität: {{ current_slot.capacity }}</span>
                    <span>Genutzt: {{ current_slot.used_capacity }}</span>
                </div>
            </div>
            {% else %}
            <div class="text-gray-500 italic">Kein aktiver Zeitslot momentan</div>
            {% endif %}
        </div>
    </template>

    <template id="widget-top-products">
        <div class="widget bg-white p-6 rounded-lg border border-indigo-100 shadow-sm hover:shadow-md transition" data-widget-id="top-products">
            <h2 class="text-lg font-medium mb-4 text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"/>
                </svg>
                Top verkaufte Produkte
            </h2>
            
            <div class="flex justify-end mb-4 chart-toolbar">
                <button type="button" class="js-list-view-btn bg-gray-100 px-3 py-1 rounded border border-gray-300 text-sm mr-2 view-btn active">
                    Liste
                </button>
                <button type="button" class="js-chart-view-btn bg-gray-100 px-3 py-1 rounded border border-gray-300 text-sm view-btn">
                    Grafik
                </button>
            </div>
            
            <div class="js-list-view space-y-4">
                {% if top_products %}
                    {% for product in top_products %}
                        <div class="flex justify-between items-center">
                            <span class="text-gray-800">{{ product.name }}</span>
                            <span class="font-medium text-indigo-600">{{ product.total }} verkauft</span>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="text-gray-500 italic">Keine Verkaufsdaten verfügbar</div>
                {% endif %}
            </div>
            
            <div class="js-chart-view" style="display: none; height: 250px;">
                <canvas class="js-products-chart"></canvas>
            </div>
        </div>
    </template>

    <template id="widget-slot-usage">
        <div class="widget bg-white p-6 rounded-lg border border-indigo-100 shadow-sm hover:shadow-md transition" data-widget-id="slot-usage">
            <h2 class="text-lg font-medium mb-4 text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14a6 6 0 110-12 6 6 0 010 12z" clip-rule="evenodd"/>
                </svg>
                Zeitslot-Auslastung heute
            </h2>
            {% if slot_usage %}
            <div class="space-y-3" id="slot-usage-list">
                {% for slot in slot_usage %}
                <div class="slot-item {% if loop.index > 4 %}extra-slot{% endif %}">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">{{ slot.start_time }} - {{ slot.end_time }}</span>
                        <span class="text-sm font-medium text-indigo-600">{{ slot.usage_percent|round(1) }}%</span>
                    </div>
                    <div class="w-full bg-indigo-100 rounded-full h-2">
                        <div class="bg-indigo-600 h-2 rounded-full progress-fill" style="width: {{ slot.usage_percent }}%"></div>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% if slot_usage|length > 4 %}
            <button onclick="toggleSlots('extra-slot', this)" class="mt-4 text-sm text-indigo-600 hover:text-indigo-800 hover:underline transition">
                Mehr anzeigen
            </button>
            {% endif %}
            {% else %}
            <div class="text-gray-500 italic">Keine Zeitslots für heute verfügbar</div>
            {% endif %}
        </div>
    </template>

    <template id="widget-low-availability">
        <div class="widget bg-white p-6 rounded-lg border border-indigo-100 shadow-sm hover:shadow-md transition" data-widget-id="low-availability">
            <h2 class="text-lg font-medium mb-4 text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                </svg>
                Produkte mit geringer Verfügbarkeit
            </h2>
            
            <div class="flex justify-end mb-4 chart-toolbar">
                <button type="button" class="js-list-view-btn bg-gray-100 px-3 py-1 rounded border border-gray-300 text-sm mr-2 view-btn active">
                    Liste
                </button>
                <button type="button" class="js-chart-view-btn bg-gray-100 px-3 py-1 rounded border border-gray-300 text-sm view-btn">
                    Grafik
                </button>
            </div>
            
            <div class="js-list-view space-y-3">
                {% if low_availability %}
                    {% for product in low_availability %}
                        <div class="flex justify-between items-center">
                            <span class="text-gray-800">{{ product.name }}</span>
                            <span class="font-medium {% if product.available < 5 %}text-red-500{% elif product.available < 10 %}text-yellow-500{% else %}text-green-500{% endif %}">
                                {{ product.available }} verfügbar
                            </span>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="text-gray-500 italic">Keine Daten zur Verfügbarkeit</div>
                {% endif %}
            </div>
            
            <div class="js-chart-view" style="display: none; height: 250px;">
                <canvas class="js-availability-chart"></canvas>
            </div>
        </div>
    </template>

    <template id="widget-recent-orders">
        <div class="widget bg-white p-6 rounded-lg border border-indigo-100 shadow-sm hover:shadow-md transition" data-widget-id="recent-orders">
            <h2 class="text-lg font-medium mb-4 text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
                </svg>
                Neueste Bestellungen
            </h2>
            {% if recent_orders %}
            <div class="space-y-3">
                {% for order in recent_orders %}
                <div class="flex justify-between items-center">
                    <span class="text-gray-800">#{{ order.id }}</span>
                    <span class="text-gray-600 text-sm">{{ order.created }}</span>
                    <span class="px-2 py-1 rounded-full text-xs font-medium
                    {% if order.status == 'completed' %}
                        bg-green-100 text-green-800
                    {% elif order.status == 'pending' %}
                        bg-yellow-100 text-yellow-800
                    {% elif order.status == 'ready' %}
                        bg-blue-100 text-blue-800
                    {% elif order.status == 'cancelled' %}
                        bg-red-100 text-red-800
                    {% else %}
                        bg-gray-100 text-gray-800
                    {% endif %}">
                        {{ order.status }}
                    </span>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="text-gray-500 italic">Keine Bestellungen gefunden</div>
            {% endif %}
        </div>
    </template>

    <template id="widget-revenue-chart">

    <script>
        function toggleSlots(className, button) {
            const items = document.querySelectorAll('.' + className);
            const isExpanded = items[0].classList.contains('expanded');
    
            items.forEach(item => {
                if (isExpanded) {
                    item.classList.remove('expanded');
                } else {
                    item.classList.add('expanded');
                }
            });
    
            button.textContent = isExpanded ? 'Mehr anzeigen' : 'Weniger anzeigen';
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Widget-Definitionen
            const widgetDefinitions = [
                { id: 'current-slot', title: 'Aktueller Zeitslot' },
                { id: 'top-products', title: 'Top verkaufte Produkte' },
                { id: 'slot-usage', title: 'Zeitslot-Auslastung heute' },
                { id: 'low-availability', title: 'Geringe Verfügbarkeit' },
                { id: 'recent-orders', title: 'Neueste Bestellungen' },
                { id: 'revenue-chart', title: 'Umsatzdaten' },
                { id: 'status-distribution', title: 'Bestellungs-Status' },
                { id: 'upcoming-slots', title: 'Kommende Slots' },
                { id: 'popular-refinements', title: 'Beliebte Verfeinerungen' },
                { id: 'top-searches', title: 'Top Suchanfragen' }
            ];

            // Standard-Dashboard-Konfiguration
            const defaultDashboardConfig = ['current-slot', 'top-products', 'low-availability', 'recent-orders', 'revenue-chart'];

            // Dashboard-Konfiguration aus localStorage laden oder Standardwerte verwenden
            let dashboardConfig = JSON.parse(localStorage.getItem('dashboardConfig')) || defaultDashboardConfig;

            // DOM-Elemente
            const widgetsContainer = document.getElementById('widgetsContainer');
            const configButton = document.getElementById('configButton');
            const configModal = document.getElementById('configModal');
            const closeConfigButton = document.getElementById('closeConfigButton');
            const activeWidgetsList = document.getElementById('activeWidgets');
            const availableWidgetsList = document.getElementById('availableWidgets');
            const saveDashboardButton = document.getElementById('saveDashboardButton');
            const resetDashboardButton = document.getElementById('resetDashboardButton');

            // Dashboard rendern
            function renderDashboard() {
                widgetsContainer.innerHTML = '';
                
                dashboardConfig.forEach(widgetId => {
                    const template = document.getElementById(`widget-${widgetId}`);
                    if (template) {
                        const clone = document.importNode(template.content, true);
                        widgetsContainer.appendChild(clone);
                    }
                });

                setTimeout(initializeCharts, 10);
            }

            // Manuelle Sortable-Implementation für Drag-and-Drop
            function setupSimpleDragDrop(listElement) {
                let draggedItem = null;
                
                Array.from(listElement.children).forEach(item => {
                    item.setAttribute('draggable', 'true');
                    
                    item.addEventListener('dragstart', function(e) {
                        draggedItem = item;
                        setTimeout(() => {
                            item.classList.add('opacity-50');
                        }, 0);
                    });
                    
                    item.addEventListener('dragend', function() {
                        draggedItem.classList.remove('opacity-50');
                        draggedItem = null;
                    });
                    
                    item.addEventListener('dragover', function(e) {
                        e.preventDefault();
                    });
                    
                    item.addEventListener('dragenter', function(e) {
                        e.preventDefault();
                        this.classList.add('bg-indigo-100');
                    });
                    
                    item.addEventListener('dragleave', function() {
                        this.classList.remove('bg-indigo-100');
                    });
                    
                    item.addEventListener('drop', function(e) {
                        e.preventDefault();
                        this.classList.remove('bg-indigo-100');
                        
                        if (draggedItem !== this) {
                            let allItems = Array.from(listElement.children);
                            let indexDragged = allItems.indexOf(draggedItem);
                            let indexThis = allItems.indexOf(this);
                            
                            if (indexDragged < indexThis) {
                                listElement.insertBefore(draggedItem, this.nextSibling);
                            } else {
                                listElement.insertBefore(draggedItem, this);
                            }
                        }
                    });
                });
                
                listElement.addEventListener('dragover', function(e) {
                    e.preventDefault();
                });
                
                listElement.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (e.target === this) {
                        this.appendChild(draggedItem);
                    }
                });
            }

            // Dashboard-Konfigurationsmodal füllen
            function fillConfigModal() {
                activeWidgetsList.innerHTML = '';
                
                dashboardConfig.forEach(widgetId => {
                    const widget = widgetDefinitions.find(w => w.id === widgetId);
                    if (widget) {
                        const li = createWidgetListItem(widget, true);
                        activeWidgetsList.appendChild(li);
                    }
                });
                
                availableWidgetsList.innerHTML = '';
                
                const availableWidgets = widgetDefinitions.filter(w => !dashboardConfig.includes(w.id));
                availableWidgets.forEach(widget => {
                    const li = createWidgetListItem(widget, false);
                    availableWidgetsList.appendChild(li);
                });

                setupSimpleDragDrop(activeWidgetsList);
                setupSimpleDragDrop(availableWidgetsList);
            }

            // Widget-Listenelement erstellen
            function createWidgetListItem(widget, isActive) {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white p-3 mb-2 border border-indigo-100 rounded cursor-move hover:bg-indigo-50 transition';
                li.dataset.widgetId = widget.id;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'font-medium text-gray-700';
                titleSpan.textContent = widget.title;
                
                li.appendChild(titleSpan);
                
                if (isActive) {
                    const removeButton = document.createElement('button');
                    removeButton.className = 'text-red-500 hover:text-red-700 transition';
                    removeButton.innerHTML = `
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    `;
                    
                    removeButton.addEventListener('click', function(e) {
                        e.stopPropagation();
                        li.remove();
                        
                        const widget = widgetDefinitions.find(w => w.id === li.dataset.widgetId);
                        if (widget) {
                            const newLi = createWidgetListItem(widget, false);
                            availableWidgetsList.appendChild(newLi);
                            setupSimpleDragDrop(availableWidgetsList);
                        }
                    });
                    
                    li.appendChild(removeButton);
                } else {
                    li.addEventListener('click', function() {
                        const widget = widgetDefinitions.find(w => w.id === li.dataset.widgetId);
                        if (widget) {
                            const newLi = createWidgetListItem(widget, true);
                            activeWidgetsList.appendChild(newLi);
                            li.remove();
                            setupSimpleDragDrop(activeWidgetsList);
                        }
                    });
                }
                
                return li;
            }

            // Charts initialisieren
            function initializeCharts() {
                // Umsatzchart
                const revenueChartEl = document.getElementById('revenueChart');
                if (revenueChartEl) {
                    const ctx = revenueChartEl.getContext('2d');
                    
                    const labels = [
                        {% for item in revenue_data %}
                        "{{ item.day }}",
                        {% endfor %}
                    ];
                    
                    const data = [
                        {% for item in revenue_data %}
                        {{ item.total }},
                        {% endfor %}
                    ];
                    
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Umsatz (€)',
                                data: data,
                                backgroundColor: 'rgba(79, 70, 229, 0.2)',
                                borderColor: 'rgba(79, 70, 229, 1)',
                                borderWidth: 1,
                                tension: 0.1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: {
                                duration: 0
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
                
                // Status-Verteilungschart
                const statusChartEl = document.getElementById('statusChart');
                if (statusChartEl) {
                    const ctx = statusChartEl.getContext('2d');
                    
                    const labels = [];
                    const data = [];
                    const colors = [];
                    
                    {% for status in status_distribution %}
                    labels.push("{{ status.status }}");
                    data.push({{ status.count }});
                    
                    {% if status.status == 'completed' %}
                    colors.push('rgba(34, 197, 94, 0.6)');
                    {% elif status.status == 'pending' %}
                    colors.push('rgba(234, 179, 8, 0.6)');
                    {% elif status.status == 'ready' %}
                    colors.push('rgba(59, 130, 246, 0.6)');
                    {% elif status.status == 'cancelled' %}
                    colors.push('rgba(239, 68, 68, 0.6)');
                    {% else %}
                    colors.push('rgba(107, 114, 128, 0.6)');
                    {% endif %}
                    {% endfor %}
                    
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: data,
                                backgroundColor: colors,
                                borderColor: colors.map(color => color.replace('0.6', '1')),
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: {
                                duration: 0
                            }
                        }
                    });
                }
            }

            // Konfiguration speichern
            function saveConfiguration() {
                const newConfig = Array.from(activeWidgetsList.children).map(li => li.dataset.widgetId);
                
                dashboardConfig = newConfig;
                localStorage.setItem('dashboardConfig', JSON.stringify(dashboardConfig));
                
                renderDashboard();
                
                configModal.classList.add('hidden');
                configModal.classList.remove('flex');
            }

            // Event-Listener
            configButton.addEventListener('click', function() {
                fillConfigModal();
                configModal.classList.remove('hidden');
                configModal.classList.add('flex');
            });

            closeConfigButton.addEventListener('click', function() {
                configModal.classList.add('hidden');
                configModal.classList.remove('flex');
            });

            saveDashboardButton.addEventListener('click', saveConfiguration);

            resetDashboardButton.addEventListener('click', function() {
                dashboardConfig = [...defaultDashboardConfig];
                localStorage.setItem('dashboardConfig', JSON.stringify(dashboardConfig));
                fillConfigModal();
                renderDashboard();
            });

            // Initialisierung
            renderDashboard();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    // Initialisiere alle Widgets mit Ansicht-Umschalter
    initViewToggleWidgets();
    
    // Observer für dynamisch hinzugefügte Widgets
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length) {
                initViewToggleWidgets();
            }
        });
    });
    
    observer.observe(document.body, { childList: true, subtree: true });
    
    function initViewToggleWidgets() {
        // Alle Widget-Typen mit Ansicht-Umschalter
        const widgetTypes = [
            'top-products',
            'low-availability',
            'popular-refinements',
            'top-searches'
        ];
        
        widgetTypes.forEach(widgetType => {
            document.querySelectorAll(`[data-widget-id="${widgetType}"]`).forEach(widget => {
                if (widget.dataset.initialized === 'true') return;
                widget.dataset.initialized = 'true';
                
                // Elemente innerhalb des Widgets finden
                const listViewBtn = widget.querySelector('.js-list-view-btn');
                const chartViewBtn = widget.querySelector('.js-chart-view-btn');
                const listView = widget.querySelector('.js-list-view');
                const chartView = widget.querySelector('.js-chart-view');
                const chartCanvas = widget.querySelector('canvas');
                
                // Chart-Referenz speichern
                let chartInstance = null;
                
                // Event-Listener für die Buttons
                if (listViewBtn && chartViewBtn && listView && chartView) {
                    listViewBtn.addEventListener('click', () => {
                        listView.style.display = 'block';
                        chartView.style.display = 'none';
                        listViewBtn.classList.add('active');
                        chartViewBtn.classList.remove('active');
                    });
                    
                    chartViewBtn.addEventListener('click', () => {
                        listView.style.display = 'none';
                        chartView.style.display = 'block';
                        chartViewBtn.classList.add('active');
                        listViewBtn.classList.remove('active');
                        
                        // Chart erstellen, falls noch nicht vorhanden
                        if (chartCanvas && !chartInstance) {
                            initChart(widget, chartCanvas);
                        }
                    });
                }
            });
        });
    }
    
    // Chart initialisieren
    function initChart(widget, chartCanvas) {
        const ctx = chartCanvas.getContext('2d');
        const widgetId = widget.dataset.widgetId;
        
        switch(widgetId) {
            case 'top-products':
                initProductsChart(widget, ctx);
                break;
            case 'low-availability':
                initAvailabilityChart(widget, ctx);
                break;
            case 'popular-refinements':
                initRefinementsChart(widget, ctx);
                break;
            case 'top-searches':
                initSearchesChart(widget, ctx);
                break;
        }
    }
    
    // Produkte-Chart
    function initProductsChart(widget, ctx) {
        const productData = [];
        
        widget.querySelectorAll('.js-list-view .flex').forEach(item => {
            const name = item.querySelector('.text-gray-800').textContent;
            const totalText = item.querySelector('.font-medium').textContent;
            const total = parseInt(totalText.match(/\d+/)[0], 10);
            
            productData.push({ name, total });
        });
        
        const colors = [
            '#4F46E5', '#818CF8', '#A5B4FC', '#C7D2FE', '#DDD6FE',
            '#C4B5FD', '#A78BFA', '#8B5CF6', '#7C3AED', '#6D28D9'
        ];
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: productData.map(item => item.name),
                datasets: [{
                    label: 'Verkaufte Einheiten',
                    data: productData.map(item => item.total),
                    backgroundColor: productData.map((_, index) => colors[index % colors.length]),
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
    
    // Verfügbarkeits-Chart
    function initAvailabilityChart(widget, ctx) {
        const productData = [];
        
        widget.querySelectorAll('.js-list-view .flex').forEach(item => {
            const name = item.querySelector('.text-gray-800').textContent;
            const availableText = item.querySelector('.font-medium').textContent;
            const available = parseInt(availableText.match(/\d+/)[0], 10);
            
            // Farbe basierend auf Verfügbarkeit
            let color = '#10B981'; // grün (Standard)
            if (available < 5) {
                color = '#EF4444'; // rot
            } else if (available < 10) {
                color = '#F59E0B'; // gelb
            }
            
            productData.push({ name, available, color });
        });
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: productData.map(item => item.name),
                datasets: [{
                    label: 'Verfügbare Einheiten',
                    data: productData.map(item => item.available),
                    backgroundColor: productData.map(item => item.color),
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
    
    // Verfeinerungen-Chart
    function initRefinementsChart(widget, ctx) {
        const refinementData = [];
        
        widget.querySelectorAll('.js-list-view .flex').forEach(item => {
            const name = item.querySelector('.text-gray-800').textContent;
            const countText = item.querySelector('.font-medium').textContent;
            const count = parseInt(countText.match(/\d+/)[0], 10);
            
            refinementData.push({ name, count });
        });
        
        const colors = [
            '#EF4444', '#F97316', '#FACC15', '#4ADE80', '#22C55E',
            '#14B8A6', '#06B6D4', '#0EA5E9', '#3B82F6', '#6366F1',
            '#8B5CF6', '#D946EF', '#EC4899', '#F43F5E', '#A3E635',
            '#FCD34D', '#E879F9', '#94A3B8', '#A78BFA', '#F87171'
        ];
        
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: refinementData.map(item => item.name),
                datasets: [{
                    data: refinementData.map(item => item.count),
                    backgroundColor: refinementData.map((_, index) => colors[index % colors.length]),
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    }
    
    // Suchanfragen-Chart
    function initSearchesChart(widget, ctx) {
        const searchData = [];
        
        widget.querySelectorAll('.js-list-view .flex').forEach(item => {
            const query = item.querySelector('.text-gray-800').textContent.replace(/"/g, '');
            const countText = item.querySelector('.font-medium').textContent;
            const count = parseInt(countText.match(/\d+/)[0], 10);
            
            searchData.push({ query, count });
        });
        
        const colors = [
            '#3B82F6', '#4F46E5', '#6366F1', '#8B5CF6', '#A78BFA', 
            '#C4B5FD', '#DDD6FE', '#EDE9FE', '#F5F3FF', '#F3F4F6'
        ];
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: searchData.map(item => item.query),
                datasets: [{
                    label: 'Anzahl der Suchen',
                    data: searchData.map(item => item.count),
                    backgroundColor: searchData.map((_, index) => colors[index % colors.length]),
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
});
    </script>
    {% endblock %}
</body>
</html>
